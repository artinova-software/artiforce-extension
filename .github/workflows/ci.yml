name: CI

# Same sequence as Bitwarden's browser pipeline: lint, typecheck, unit tests,
# one build per browser, zips as artifacts, then the Playwright suite against
# the e2e build. Actions are pinned by commit SHA (Dependabot keeps them fresh).

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (DOM and WebWorker)
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build Chrome
        run: pnpm run build:chrome

      - name: Build Edge
        run: pnpm run build:edge

      - name: Build Firefox
        run: pnpm run build:firefox

      - name: Build Safari
        run: pnpm run build:safari

      - name: Lint the Firefox build (web-ext)
        run: pnpm --filter @artiforce-software/browser-extension run lint:firefox

      - name: Zip the builds
        run: |
          for browser in chrome edge firefox safari; do
            pnpm --filter @artiforce-software/browser-extension run zip --browser "$browser" --target production
          done

      - name: Upload the zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zips
          path: apps/browser/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: End-to-end (Chromium)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Chromium
        run: pnpm --filter @artiforce-software/browser-extension exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/browser/playwright-report
            apps/browser/test-results
          retention-days: 7
