name: Release

# Manual, from main: bump the version (root package.json is the only source),
# commit and tag it, build the four store packages (Chrome, Edge, Firefox,
# Safari) and the AMO source archive, and publish a GitHub release with them.
# Then publish.yml sends the packages to the stores listed in the PUBLISH_STORES
# variable (default chrome,firefox,safari) once a reviewer approves the
# `production` environment (docs/release.md).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor or major"
        type: choice
        options: [patch, minor, major]
        default: patch
      release_notes:
        description: "What's new, in French (AMO and the App Store)"
        type: string
        default: Corrections et améliorations.

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Check
        run: pnpm run check

      - name: Bump the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"

      - name: Build the store packages and the source archive
        run: pnpm run dist

      - name: Push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push --atomic origin HEAD:main "v$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes apps/browser/dist/*.zip

  publish:
    name: Publish
    needs: release
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
    with:
      tag: v${{ needs.release.outputs.version }}
      stores: ${{ vars.PUBLISH_STORES || 'chrome,firefox,safari' }}
      release_notes: ${{ inputs.release_notes }}
    secrets: inherit
