<!doctype html>
<html lang="fr">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <link rel="stylesheet" href="../Style.css" />
    <script src="../Script.js" defer></script>
  </head>
  <body>
    <img src="../Icon.png" width="128" height="128" alt="Icône Artiforce" />
    <p class="state-unknown">
      Vous pouvez activer l’extension Artiforce dans les préférences Extensions de Safari.
    </p>
    <p class="state-on">
      L’extension Artiforce est activée. Vous pouvez la désactiver dans les préférences Extensions
      de Safari.
    </p>
    <p class="state-off">
      L’extension Artiforce est désactivée. Vous pouvez l’activer dans les préférences Extensions de
      Safari.
    </p>
    <button class="open-preferences">
      Quitter et ouvrir les préférences Extensions de Safari…
    </button>
  </body>
</html>
