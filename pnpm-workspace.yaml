packages:
  - apps/*
  - libs/*

# Versions shared by several workspaces: bump them here, once.
catalog:
  "@phosphor-icons/react": 2.1.10
  "@tailwindcss/postcss": 4.3.3
  react: 19.2.7
  react-dom: 19.2.7
  tailwindcss: 4.3.3
  typescript: 7.0.2
  zod: 4.6.7

engineStrict: true

allowBuilds:
  "@swc/core": true
  esbuild: true
  fsevents: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    # Same exceptions as the Artinova monorepo: both plugins run on ESLint 10
    # with the flat config; their peer ranges have not caught up yet.
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
